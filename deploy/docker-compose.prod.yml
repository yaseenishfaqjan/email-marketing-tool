# Production, following the VPS playbook in docs/VPS-PLAYBOOK.md.
#
#   cd /opt/mailer/deploy && docker compose -f docker-compose.prod.yml up -d
#
# No host ports are published. mailer-api joins scalaro-net, the network the
# shared nginx container is already on, so nginx reaches it by container name.
# On a box already running fifteen applications, that removes the question of
# which port is free — and nothing is exposed to the internet except through
# nginx.
#
# The API and the worker are separate processes on purpose. The API answers in
# milliseconds; the worker spends minutes draining a broadcast. Sharing a
# process would make the signup forms slow during a send, and restarting to
# deploy an API fix would interrupt one.

services:
  mailer-db:
    image: postgres:16-alpine
    container_name: mailer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailer
      POSTGRES_DB: mailer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ../.env}
    volumes:
      # A named volume, never a bind mount into the deploy directory. A
      # redeploy replaces that directory, and the contacts are the asset here.
      - mailer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailer"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately NOT on scalaro-net. Nothing outside this stack needs to
    # reach the database.
    networks: [mailernet]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  mailer-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mailer:latest
    container_name: mailer-api
    restart: unless-stopped
    command: sh -c "npm run migrate && npm run templates && node src/server.mjs"
    env_file: [../.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mailer:${POSTGRES_PASSWORD}@mailer-db:5432/mailer
    expose:
      - "8080"
    depends_on:
      mailer-db: { condition: service_healthy }
    networks: [mailernet, scalaro-net]
    logging: *logging

  mailer-worker:
    image: mailer:latest
    container_name: mailer-worker
    restart: unless-stopped
    # Waits for the API to finish migrating before it starts claiming work.
    command: sh -c "sleep 20 && node src/worker/send-worker.mjs"
    env_file: [../.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mailer:${POSTGRES_PASSWORD}@mailer-db:5432/mailer
    depends_on:
      mailer-db: { condition: service_healthy }
      mailer-api: { condition: service_started }
    # ONE worker. Each process owns its own send-rate token bucket, so two
    # would together exceed the SES rate. Scaling past one means moving the
    # rate limiter to Redis — see the note in the README.
    deploy:
      replicas: 1
    # SIGTERM lets it finish the batch in flight rather than abandoning
    # messages in 'sending'.
    stop_grace_period: 60s
    networks: [mailernet]
    logging: *logging

volumes:
  mailer-data:

networks:
  mailernet:
  scalaro-net:
    external: true
