# Tracking links are public and must terminate TLS on the brand's own domain.
# A link whose hostname does not match the sender is both a deliverability
# penalty and the thing that stops a careful reader clicking.
#
# One server block per brand tracking domain, all proxying to the same service.
# Certificates: certbot --nginx -d links.keptportraits.com -d links.lawnpilot.com ...

server {
    listen 80;
    server_name links.keptportraits.com links.lawnpilot.com links.peachpicks.app;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name links.keptportraits.com links.lawnpilot.com links.peachpicks.app;

    ssl_certificate     /etc/letsencrypt/live/links.keptportraits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.keptportraits.com/privkey.pem;

    # Only the public endpoints. The admin API is NOT exposed on the tracking
    # domain — that hostname appears in every email that goes out.
    location ~ ^/(o|c|u)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ses {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}

# The admin API and the subscribe endpoint, on their own hostname.
server {
    listen 443 ssl http2;
    server_name mailer.internal.example;

    ssl_certificate     /etc/letsencrypt/live/mailer.internal.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailer.internal.example/privkey.pem;

    client_max_body_size 30m;   # CSV imports

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
