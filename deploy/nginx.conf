# Add these two blocks to /opt/scalaro/nginx.conf, then:
#
#   cd /opt/scalaro && docker compose exec nginx nginx -t
#   cd /opt/scalaro && docker compose exec nginx nginx -s reload
#
# Tracking links must be on the brand's own domain. A link whose hostname does
# not match the sender costs deliverability, and it costs reader trust — people
# hover over links.

server {
    listen 80;
    listen [::]:80;
    server_name links.scalaro.io;

    # The webroot already mounted into the nginx container. Certificates renew
    # through this path without anything being stopped.
    location /.well-known/acme-challenge/ { root /etc/letsencrypt/www; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name links.scalaro.io;

    ssl_certificate     /etc/letsencrypt/live/links.scalaro.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.scalaro.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 30m;   # CSV imports

    # Only the public paths are served on this hostname: the open pixel, the
    # click redirect, one-click unsubscribe, double opt-in confirmation, the
    # signup form script and its submit endpoint, and the SES webhook.
    #
    # This hostname appears in every email that goes out, so the admin API and
    # the dashboard are deliberately NOT reachable here.
    location ~ ^/(o|c|u|confirm|f)/ {
        proxy_pass http://mailer-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /webhooks/ses {
        proxy_pass http://mailer-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://mailer-api:8080;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}

# The admin API, the dashboard and the subscribe endpoint, on their own
# hostname. Separate so that a hostname printed in every marketing email is
# never also the one serving the admin surface.
